name: Simulation quality gate
on: [push, pull_request, workflow_dispatch]
jobs:
  portable:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiment.py --split smoke --modes oracle --skip-safety --out ci
      - run: python -c 'import json; r=json.load(open("ci/summary.json"))["oracle"]; assert r["runs"] == r["goals"] == 5'
  gazebo:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: |
          mkdir -p gazebo_runs
          for seed in 300 301 302 303 304; do
            docker compose run --rm simulation bash ros/run.sh "$seed" oracle
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for seed in range(300, 305):
              run = json.loads(Path(f"gazebo_runs/oracle_{seed}.json").read_text())
              assert run["status"] == "goal" and run["frames"] >= 50, run
              assert run["min_clearance_m"] > 0 and run["motion_commands"] > 0, run
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gazebo-logs
          path: gazebo_runs
